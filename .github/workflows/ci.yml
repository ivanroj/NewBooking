name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_DB_DSN: postgres://postgres:postgres@localhost:5432/coworking_db?sslmode=disable
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: coworking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Modules
        run: go mod tidy

      - name: Unit tests
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

      - name: Integration tests
        run: go test -tags=integration ./...

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & lint
        working-directory: frontend
        run: |
          npm install
          npm run lint
